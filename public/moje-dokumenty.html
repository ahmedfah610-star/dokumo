<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface2: #f2f1ee;
  --surface3: #e9e8e4;
  --border: rgba(24,32,28,.09);
  --border2: rgba(24,32,28,.16);
  --ink: #141b17;
  --ink2: #59625c;
  --ink3: rgba(20,27,23,.42);
  --acc: #0f766e;
  --acc2: #10b981;
  --acc-grad: linear-gradient(135deg,#0f766e 0%,#10b981 100%);
  --acc-soft: rgba(16,150,110,.10);
  --acc-line: rgba(16,150,110,.28);
  --red: #dc2626;
  --red-soft: rgba(220,38,38,.10);
  --shadow-sm: 0 1px 2px rgba(24,40,32,.05);
  --shadow-md: 0 1px 2px rgba(24,40,32,.05), 0 10px 26px rgba(24,50,38,.09);
  --shadow-lg: 0 2px 4px rgba(24,40,32,.06), 0 20px 46px rgba(24,50,38,.14);
  --r: 18px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "DM Sans", sans-serif; font-size: 15px;
  min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}

/* ── NAV ── */
.m-nav {
  height: 58px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: rgba(246,245,242,.82); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.m-nav-logo {
  display: flex; align-items: center; gap: 8px; text-decoration: none;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 1.15rem; color: var(--ink); letter-spacing: -.02em;
}
.m-nav-account {
  display: flex; align-items: center; gap: 6px;
  font-size: .78rem; font-weight: 600; color: var(--ink2);
  text-decoration: none; padding: 7px 13px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); transition: all .18s;
}
.m-nav-account:hover { color: var(--ink); border-color: var(--border2); box-shadow: var(--shadow-sm); }

/* ── HERO HEADER ── */
.m-hero { max-width: 1000px; margin: 0 auto; padding: 34px 24px 0; }
.m-hero-inner {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg,#ffffff 0%, #fbfbfa 100%);
  border: 1px solid var(--border); border-radius: 26px;
  padding: 30px 30px 26px; box-shadow: var(--shadow-md);
}
.m-hero-glow {
  position: absolute; top: -120px; right: -80px; width: 340px; height: 340px;
  background: radial-gradient(circle, rgba(16,185,129,.16), transparent 62%);
  pointer-events: none; z-index: 0;
}
.m-hero-inner > :not(.m-hero-glow) { position: relative; z-index: 1; }
.m-eyebrow {
  font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
  color: var(--acc); margin-bottom: 12px; display: inline-flex; align-items: center; gap: 8px;
}
.m-eyebrow::before { content:""; width: 20px; height: 2px; border-radius: 2px; background: var(--acc-grad); }
.m-header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.m-title {
  font-family: "Bricolage Grotesque", sans-serif;
  font-size: clamp(1.7rem, 3.6vw, 2.35rem);
  font-weight: 800; letter-spacing: -.035em; color: var(--ink); line-height: 1.05;
}
.m-count-badge {
  display: inline-flex; align-items: center;
  font-size: .64rem; font-weight: 800; letter-spacing: .06em;
  padding: 4px 10px; border-radius: 999px;
  background: var(--acc-soft); color: var(--acc);
  border: 1px solid var(--acc-line); margin-left: 12px; vertical-align: middle;
  font-family: "DM Sans", sans-serif;
}
.m-subtitle { font-size: .9rem; color: var(--ink2); margin-top: 9px; max-width: 46ch; line-height: 1.5; }
.m-new-btn {
  display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 12px 22px; border-radius: 999px;
  background: var(--acc-grad); color: #fff; text-decoration: none;
  font-family: "Bricolage Grotesque", sans-serif; font-size: .86rem; font-weight: 700;
  box-shadow: 0 8px 20px rgba(15,118,110,.26); transition: transform .16s, box-shadow .16s;
}
.m-new-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,118,110,.34); }
.m-new-btn span.plus { font-size: 1.1rem; line-height: 1; margin-top: -1px; }

/* ── STATS ── */
.m-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 26px; }
.m-stat {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 16px;
}
.m-stat-num {
  font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
  font-size: 1.5rem; letter-spacing: -.02em; color: var(--ink); line-height: 1;
  font-variant-numeric: tabular-nums;
}
.m-stat:first-child .m-stat-num { background: var(--acc-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.m-stat-label { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink3); margin-top: 7px; }

/* ── TOOLBAR ── */
.m-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 22px 24px 16px; max-width: 1000px; margin: 0 auto;
}
.m-search-wrap { position: relative; flex: 1; min-width: 220px; }
.m-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink3); font-size: .9rem; pointer-events: none; }
.m-search {
  width: 100%; padding: 11px 14px 11px 40px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; color: var(--ink);
  font-family: "DM Sans", sans-serif; font-size: .88rem;
  outline: none; transition: border-color .18s, box-shadow .18s; box-shadow: var(--shadow-sm);
}
.m-search::placeholder { color: var(--ink3); }
.m-search:focus { border-color: var(--acc-line); box-shadow: 0 0 0 4px var(--acc-soft); }

.m-filters { display: inline-flex; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
.m-filter {
  padding: 8px 15px; font-family: "DM Sans", sans-serif;
  font-size: .74rem; font-weight: 700; letter-spacing: .03em;
  border: none; border-radius: 9px; background: transparent; color: var(--ink2);
  cursor: pointer; transition: all .16s;
}
.m-filter:hover { color: var(--ink); }
.m-filter.active { background: var(--surface); color: var(--acc); box-shadow: var(--shadow-sm); }

.m-sort-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.m-sort-label { font-size: .74rem; color: var(--ink3); white-space: nowrap; }
.m-sort-select {
  font-family: "DM Sans", sans-serif; font-size: .78rem; font-weight: 600;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--ink2);
  padding: 8px 12px; cursor: pointer; outline: none; transition: border-color .18s; box-shadow: var(--shadow-sm);
}
.m-sort-select:focus { border-color: var(--acc-line); }

/* ── RESULTS BAR ── */
.m-results-bar {
  max-width: 1000px; margin: 0 auto; padding: 0 24px 16px;
  font-size: .76rem; color: var(--ink3); font-weight: 500;
  display: flex; align-items: center; justify-content: space-between;
}
.btn-select-all {
  padding: 8px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  font-family: "DM Sans", sans-serif; font-size: .76rem; font-weight: 700;
  color: var(--ink2); cursor: pointer; transition: all .15s; white-space: nowrap; box-shadow: var(--shadow-sm);
}
.btn-select-all:hover { border-color: var(--border2); color: var(--ink); }

/* ── CONTENT / GRID ── */
.m-content { max-width: 1000px; margin: 0 auto; padding: 0 24px 90px; }
.m-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }

/* ── DOC CARD ── */
.d-card {
  position: relative; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--r);
  overflow: hidden; box-shadow: var(--shadow-sm);
  transition: transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s, border-color .22s;
}
.d-card::before {
  content:""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: var(--acc-grad); opacity: 0; transition: opacity .22s;
}
.d-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--acc-line); }
.d-card:hover::before { opacity: 1; }
.d-card-top { padding: 20px 20px 16px; }
.d-card-row1 { display: flex; align-items: flex-start; gap: 13px; margin-bottom: 12px; }
.d-card-icon {
  width: 46px; height: 46px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 1.35rem; line-height: 1;
  border-radius: 13px; color: #fff;
  background: linear-gradient(135deg,#334155,#64748b);
  box-shadow: 0 6px 16px rgba(30,41,59,.22);
}
.cat-kariera .d-card-icon { background: linear-gradient(135deg,#0f766e,#10b981); box-shadow: 0 6px 16px rgba(15,118,110,.28); }
.cat-biznes  .d-card-icon { background: linear-gradient(135deg,#4f46e5,#7c3aed); box-shadow: 0 6px 16px rgba(79,70,229,.26); }
.d-card-meta { flex: 1; min-width: 0; }
.d-card-name {
  font-family: "Bricolage Grotesque", sans-serif;
  font-size: .98rem; font-weight: 700; color: var(--ink);
  line-height: 1.28; margin-bottom: 8px; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.d-cat-badge {
  display: inline-flex; align-items: center;
  font-size: .6rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px;
  background: var(--surface2); color: var(--ink2); border: 1px solid var(--border);
}
.cat-kariera .d-cat-badge { background: rgba(16,150,110,.10); color: #0f766e; border-color: rgba(16,150,110,.22); }
.cat-biznes  .d-cat-badge { background: rgba(99,90,229,.10); color: #5b52e0; border-color: rgba(99,90,229,.22); }
.d-status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .6rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; margin-left: 6px;
  background: rgba(16,150,110,.09); color: #0f766e; border: 1px solid rgba(16,150,110,.18);
}
.d-card-date {
  font-size: .72rem; color: var(--ink3); font-weight: 500;
  font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px;
}
.d-card-date::before { content:"🕐"; font-size: .72rem; filter: grayscale(1) opacity(.5); }

.d-card-actions {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  padding: 12px 16px; border-top: 1px solid var(--border); background: linear-gradient(180deg,#fcfcfb,#f8f8f6);
}
.d-action-btn {
  padding: 7px 13px; font-family: "DM Sans", sans-serif;
  font-size: .73rem; font-weight: 700; letter-spacing: .02em;
  border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink2);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.d-action-btn:hover { border-color: var(--border2); color: var(--ink); transform: translateY(-1px); }
.d-action-btn.primary { background: var(--acc-grad); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(15,118,110,.24); }
.d-action-btn.primary:hover { box-shadow: 0 7px 16px rgba(15,118,110,.32); color: #fff; }
.d-action-btn.danger:hover { border-color: rgba(220,38,38,.4); color: var(--red); background: var(--red-soft); }

/* ── SELECT MODE ── */
.d-card-cb {
  display: none; position: absolute; top: 14px; right: 14px; z-index: 3;
  width: 22px; height: 22px; border-radius: 7px;
  border: 2px solid var(--border2); background: var(--surface);
  cursor: pointer; accent-color: var(--acc); transition: border-color .15s;
}
.select-mode .d-card-cb { display: block; }
.select-mode .d-card { cursor: pointer; }
.d-card.selected { border-color: var(--acc-line); background: linear-gradient(180deg,rgba(16,150,110,.05),#fff); box-shadow: 0 0 0 3px var(--acc-soft); }
.d-card.selected .d-card-cb { border-color: var(--acc); }

/* ── BULK BAR ── */
.bulk-bar {
  display: none; position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; border-radius: 16px; padding: 11px 12px 11px 20px;
  box-shadow: 0 18px 44px rgba(20,27,23,.32); align-items: center; gap: 10px; z-index: 400;
  font-family: "DM Sans", sans-serif; font-size: .84rem; white-space: nowrap;
}
.bulk-bar.open { display: flex; animation: fadeUp .25s ease both; }
.bulk-bar-count { font-weight: 700; }
.bulk-bar-cancel {
  padding: 8px 15px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.22);
  background: transparent; color: rgba(255,255,255,.78);
  font-family: "DM Sans", sans-serif; font-size: .8rem; font-weight: 600; cursor: pointer; transition: all .15s;
}
.bulk-bar-cancel:hover { border-color: rgba(255,255,255,.55); color: #fff; }
.bulk-bar-del {
  padding: 8px 17px; border-radius: 10px; border: none;
  background: var(--red); color: #fff;
  font-family: "DM Sans", sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.bulk-bar-del:hover { opacity: .88; }
.bulk-bar-del:disabled { opacity: .4; cursor: not-allowed; }

/* ── EMPTY STATE ── */
.m-empty {
  text-align: center; padding: 72px 24px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 22px; margin-top: 4px; box-shadow: var(--shadow-sm);
}
.m-empty-icon {
  font-size: 1.8rem; margin: 0 auto 18px; display: grid; place-items: center;
  width: 68px; height: 68px; border-radius: 20px;
  background: var(--acc-soft); border: 1px solid var(--acc-line);
}
.m-empty-title {
  font-family: "Bricolage Grotesque", sans-serif;
  font-size: 1.3rem; font-weight: 800; color: var(--ink);
  letter-spacing: -.02em; margin-bottom: 9px;
}
.m-empty-sub { font-size: .88rem; color: var(--ink2); line-height: 1.6; margin-bottom: 24px; max-width: 42ch; margin-left: auto; margin-right: auto; }
.m-empty-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 12px 24px; border-radius: 999px;
  background: var(--acc-grad); color: #fff; border: none;
  font-family: "Bricolage Grotesque", sans-serif; font-size: .85rem; font-weight: 700;
  text-decoration: none; box-shadow: 0 8px 20px rgba(15,118,110,.26); transition: transform .16s, box-shadow .16s;
}
.m-empty-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(15,118,110,.34); }

/* ── EDIT MODAL ── */
.m-edit-overlay { display: none; position: fixed; inset: 0; background: rgba(20,27,23,.5); backdrop-filter: blur(8px); z-index: 800; align-items: center; justify-content: center; }
.m-edit-overlay.open { display: flex; }
.m-edit-box {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 22px; padding: 26px;
  width: 100%; max-width: 700px; margin: 16px; box-shadow: 0 30px 70px rgba(20,40,32,.28);
  animation: fadeUp .25s ease both; display: flex; flex-direction: column; gap: 16px; max-height: 86vh;
}
.m-edit-title { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--ink); }
.m-edit-textarea {
  flex: 1; min-height: 320px; max-height: 55vh;
  background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--ink);
  font-family: "DM Sans", sans-serif; font-size: .88rem; line-height: 1.7;
  padding: 16px; resize: vertical; outline: none; transition: border-color .18s, box-shadow .18s;
}
.m-edit-textarea:focus { border-color: var(--acc-line); box-shadow: 0 0 0 4px var(--acc-soft); }
.m-edit-btns { display: flex; gap: 10px; justify-content: flex-end; }
.m-edit-cancel {
  padding: 11px 22px; border: 1px solid var(--border); background: var(--surface2); border-radius: 11px;
  font-family: "DM Sans", sans-serif; font-size: .8rem; font-weight: 700; color: var(--ink2); cursor: pointer; transition: all .15s;
}
.m-edit-cancel:hover { border-color: var(--border2); color: var(--ink); }
.m-edit-save {
  padding: 11px 26px; border: none; background: var(--acc-grad); border-radius: 11px;
  font-family: "DM Sans", sans-serif; font-size: .8rem; font-weight: 700; color: #fff; cursor: pointer;
  box-shadow: 0 6px 16px rgba(15,118,110,.26); transition: transform .16s, box-shadow .16s;
}
.m-edit-save:hover { transform: translateY(-1px); box-shadow: 0 9px 20px rgba(15,118,110,.34); }

/* ── CONFIRM MODAL ── */
.m-confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(20,27,23,.5); backdrop-filter: blur(6px); z-index: 800; align-items: center; justify-content: center; }
.m-confirm-overlay.open { display: flex; }
.m-confirm-box {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 22px; padding: 30px 26px;
  max-width: 380px; width: 100%; margin: 16px; box-shadow: 0 30px 70px rgba(20,40,32,.28); animation: fadeUp .25s ease both; text-align: center;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.m-confirm-title { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.15rem; font-weight: 800; color: var(--ink); margin-bottom: 9px; }
.m-confirm-sub { font-size: .86rem; color: var(--ink2); line-height: 1.6; margin-bottom: 24px; }
.m-confirm-btns { display: flex; gap: 10px; }
.m-confirm-cancel {
  flex: 1; padding: 12px; border: 1px solid var(--border); background: var(--surface2); border-radius: 11px;
  font-family: "DM Sans", sans-serif; font-size: .8rem; font-weight: 700; color: var(--ink2); cursor: pointer; transition: all .15s;
}
.m-confirm-cancel:hover { border-color: var(--border2); color: var(--ink); }
.m-confirm-delete {
  flex: 1; padding: 12px; border: none; background: var(--red); color: #fff; border-radius: 11px;
  font-family: "DM Sans", sans-serif; font-size: .8rem; font-weight: 700; cursor: pointer; transition: opacity .15s;
}
.m-confirm-delete:hover { opacity: .88; }

/* ── TOAST ── */
.m-toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(90px);
  background: var(--ink); color: #fff; border: none;
  padding: 13px 24px; border-radius: 14px;
  font-family: "DM Sans", sans-serif; font-size: .84rem; font-weight: 600;
  z-index: 900; transition: transform .32s cubic-bezier(.2,.7,.2,1); pointer-events: none;
  white-space: nowrap; box-shadow: 0 14px 40px rgba(20,27,23,.3);
}
.m-toast.show { transform: translateX(-50%) translateY(0); }

@media(max-width: 680px) {
  .m-hero { padding: 22px 14px 0; }
  .m-hero-inner { padding: 22px 20px; border-radius: 22px; }
  .m-toolbar { padding: 18px 16px 14px; }
  .m-results-bar { padding: 0 16px 12px; }
  .m-content { padding: 0 16px 70px; }
  .m-grid { grid-template-columns: 1fr; }
  .m-header-row { flex-direction: column; align-items: flex-start; }
  .m-new-btn { width: 100%; justify-content: center; }
  .m-stats { grid-template-columns: repeat(2,1fr); }
  .m-filters { flex: 1; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="m-nav">
  <a href="index.html" class="m-nav-logo">
    <img src="logo2-64.png" style="height:28px;width:auto;display:block;">
    Dokumo
  </a>
  <a href="konto.html" class="m-nav-account">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span>Konto</span>
  </a>
</nav>

<!-- HERO -->
<div class="m-hero">
  <div class="m-hero-inner">

<!-- FIREBASE AUTH -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const __c=await(await fetch('/api/nip-lookup?fbconfig')).json();const app = initializeApp(__c);
const auth = getAuth(app);

onAuthStateChanged(auth, async user => {
  window._fbReady = true;
  window._fbToken = user ? () => user.getIdToken(true) : null;
  window._firebaseUser = user || null;
  if (user) {
    localStorage.setItem('dokumo_user', JSON.stringify({
      name: user.displayName || '',
      email: user.email || '',
      photo: user.photoURL || ''
    }));
    try {
      const token = await user.getIdToken();
      const res = await fetch('/api/check-sub', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (data.active && data.expiresAt) {
        localStorage.setItem('dokumo_sub', JSON.stringify({ plan: data.plan, expiresAt: data.expiresAt }));
      }
    } catch(e) {}
  } else {
    localStorage.removeItem('dokumo_user');
  }
  if (!user) {
    document.getElementById('resultsLabel').textContent = '';
    document.getElementById('myDocGrid').innerHTML =
      '<div class="m-empty">' +
      '<span class="m-empty-icon">🔒</span>' +
      '<div class="m-empty-title">Zaloguj się</div>' +
      '<p class="m-empty-sub">Musisz być zalogowany, aby zobaczyć swoje dokumenty.</p>' +
      '<a href="konto.html" class="m-empty-btn">Zaloguj się →</a>' +
      '</div>';
  } else {
    loadAndRender();
  }
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// ── STATE ──
window._allDocs = [];
var activeFilter = 'all';

function escHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ── API ──
async function getToken() {
  for (var i = 0; i < 30 && !window._fbReady; i++) {
    await new Promise(function(r) { setTimeout(r, 100); });
  }
  if (window._fbToken) {
    try { return await window._fbToken(); } catch(e) {}
  }
  return null;
}

async function loadDocsFromAPI() {
  var token = await getToken();
  if (!token) return [];
  try {
    var res = await fetch('/api/get-docs', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) return [];
    var data = await res.json();
    return data.docs || [];
  } catch(e) { return []; }
}

async function deleteDocAPI(docId) {
  var token = await getToken();
  if (!token) return;
  await fetch('/api/update-doc', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ docId: docId })
  });
}

// ── RENDER ──
async function loadAndRender() {
  document.getElementById('myDocGrid').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--ink3);font-size:.85rem;">Ładowanie dokumentów…</div>';
  window._allDocs = await loadDocsFromAPI();
  filterAndRender();
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.m-filter').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  filterAndRender();
}

function updateStats() {
  var all = window._allDocs || [];
  var k = 0, b = 0, latest = 0;
  all.forEach(function(d) {
    if (d.cat === 'kariera') k++; else if (d.cat === 'biznes') b++;
    var ts = new Date(d.createdAt || 0).getTime();
    if (ts > latest) latest = ts;
  });
  var set = function(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
  set('statTotal', all.length); set('statKariera', k); set('statBiznes', b);
  set('statUpdated', latest ? new Date(latest).toLocaleDateString('pl-PL', { day: '2-digit', month: 'short' }) : '—');
}

function filterAndRender() {
  var docs = [].concat(window._allDocs || []);
  var q = (document.getElementById('mySearch').value || '').toLowerCase().trim();
  var sort = document.getElementById('mySort').value;

  // Ukryj listy motywacyjne bez danych (nie można wygenerować PDF)
  docs = docs.filter(function(d) {
    if (d.typeId === 'cover-letter' || (d.text && d.text.indexOf('__LM_HTML__:') === 0)) {
      return d.covDataJson || (d.text && d.text.indexOf('__LM_HTML__:') === 0);
    }
    return true;
  });

  if (activeFilter === 'kariera') docs = docs.filter(function(d) { return d.cat === 'kariera'; });
  else if (activeFilter === 'biznes') docs = docs.filter(function(d) { return d.cat === 'biznes'; });

  if (q) docs = docs.filter(function(d) { return (d.name||'').toLowerCase().includes(q); });

  if (sort === 'newest') docs.sort(function(a,b) { return new Date(b.createdAt||0) - new Date(a.createdAt||0); });
  if (sort === 'oldest') docs.sort(function(a,b) { return new Date(a.createdAt||0) - new Date(b.createdAt||0); });
  if (sort === 'name') docs.sort(function(a,b) { return (a.name||'').localeCompare(b.name||'','pl'); });

  var total = (window._allDocs || []).length;
  var badge = document.getElementById('docCount');
  badge.textContent = total ? total : '';
  badge.style.display = total ? '' : 'none';
  updateStats();
  document.getElementById('resultsLabel').textContent =
    docs.length + ' ' + (docs.length === 1 ? 'dokument' : docs.length < 5 ? 'dokumenty' : 'dokumentów');

  var grid = document.getElementById('myDocGrid');

  if (docs.length === 0) {
    grid.innerHTML = '<div class="m-empty">' +
      '<span class="m-empty-icon">📂</span>' +
      '<div class="m-empty-title">' + (total === 0 ? 'Brak dokumentów' : 'Brak wyników') + '</div>' +
      '<p class="m-empty-sub">' + (total === 0 ? 'Wygeneruj swój pierwszy dokument — zajmie to mniej niż minutę.' : 'Spróbuj innego filtra lub frazy.') + '</p>' +
      (total === 0 ? '<a href="index.html" class="m-empty-btn">Przeglądaj dokumenty →</a>' : '') +
      '</div>';
    return;
  }

  var html = '<div class="m-grid' + (_selectMode ? ' select-mode' : '') + '">';
  docs.forEach(function(doc) {
    var id = doc.id || '';
    var name = escHtml(doc.name || 'Dokument');
    var icon = escHtml(doc.icon || '📄');
    var catLabel = escHtml(doc.catLabel || doc.cat || '');
    var date = formatDate(doc.createdAt);
    var isSel = _selected[id] ? ' selected' : '';
    html += '<div class="d-card cat-' + (doc.cat || 'inne') + isSel + '" data-id="' + id + '" onclick="if(_selectMode){var cb=this.querySelector(\'.d-card-cb\');toggleCard(\'' + id + '\',this,cb);}">';
    html += '<input type="checkbox" class="d-card-cb"' + (isSel ? ' checked' : '') + ' onclick="event.stopPropagation();var card=this.closest(\'.d-card\');toggleCard(\'' + id + '\',card,this);">';
    html += '<div class="d-card-top">';
    html += '<div class="d-card-row1">';
    html += '<div class="d-card-icon">' + icon + '</div>';
    html += '<div class="d-card-meta">';
    html += '<div class="d-card-name" title="' + name + '">' + name + '</div>';
    html += '<div>';
    if (catLabel) html += '<span class="d-cat-badge">' + catLabel + '</span>';
    html += '<span class="d-status-badge">&#10003; Wygenerowany</span>';
    if (doc.complianceNeedsReview) {
      var radarTitle = escHtml((doc.complianceFlags || []).map(function(f){ return f.summary || f.title || ''; }).join(' ') || 'Zmiana w przepisach może dotyczyć tego dokumentu.');
      html += '<span class="d-status-badge" style="background:rgba(243,156,18,.15);color:#b9770e" title="' + radarTitle + '">&#9888; Może wymagać przeglądu</span>';
    }
    html += '</div>';
    html += '</div></div>';
    html += '<div class="d-card-date">Utworzono: ' + date + '</div>';
    html += '</div>';
    html += '<div class="d-card-actions">';
    if (doc.status === 'generated' || doc.text) {
      html += '<button class="d-action-btn primary" onclick="downloadDoc(\'' + id + '\',\'pdf\')">PDF</button>';
      html += '<button class="d-action-btn" onclick="downloadDoc(\'' + id + '\',\'txt\')">TXT</button>';
      html += '<button class="d-action-btn" onclick="downloadDoc(\'' + id + '\',\'docx\')">Word</button>';
    }
    html += '<button class="d-action-btn" title="Edytuj" onclick="editDoc(\'' + id + '\')" style="margin-left:auto">✏️</button>';
    html += '<button class="d-action-btn danger" onclick="askDelete(\'' + id + '\')">&#10005; Usuń</button>';
    html += '</div></div>';
  });
  html += '</div>';
  grid.innerHTML = html;
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ── COVER LETTER HTML BUILDER ──
function buildCoverLetterHTML(d) {
  var esc = function(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var nl2br = function(s) { return esc(s).replace(/\n/g,'<br>'); };
  var fullName = [d.firstName, d.lastName].filter(Boolean).join(' ');
  var today = new Date().toLocaleDateString('pl-PL', {day:'numeric', month:'long', year:'numeric'});

  var senderHtml = '<b>' + esc(fullName || 'Imię Nazwisko') + '</b>';
  if (d.street) senderHtml += '<br>' + esc(d.street);
  var zipCity = [d.zip, d.city].filter(Boolean).join(' ');
  if (zipCity) senderHtml += '<br>' + esc(zipCity);
  if (d.email) senderHtml += '<br>' + esc(d.email);
  if (d.phone) senderHtml += '<br>' + esc(d.phone);

  var dateHtml = esc((d.city || 'Miejscowość') + ', ' + today);

  var recipientBlock = '';
  if (d.rCompany || d.rContact) {
    var rLines = [];
    if (d.rCompany) rLines.push('<b>' + esc(d.rCompany) + '</b>');
    if (d.rContact) rLines.push(esc(d.rContact));
    if (d.rStreet)  rLines.push(esc(d.rStreet));
    var rZipCity = [d.rZip, d.rCity].filter(Boolean).join(' ');
    if (rZipCity) rLines.push(esc(rZipCity));
    recipientBlock = '<div style="margin-bottom:32px;">' + rLines.join('<br>') + '</div>';
  }

  var subjectLine = d.position
    ? '<div style="margin-bottom:24px;">Dotyczy: Aplikacja na stanowisko <b>' + esc(d.position) + '</b>' + (d.company ? ' w firmie <b>' + esc(d.company) + '</b>' : '') + '</div>'
    : '';

  var salutation = d.rContact
    ? 'Szanowna Pani/Panie ' + esc((d.rContact.split(' ').slice(-1)[0]) || '') + ','
    : 'Szanowni Państwo,';

  var bodyHtml = d.body
    ? '<div style="text-align:justify;">' + nl2br(d.body) + '</div>'
    : '';

  var inner =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;">' +
      '<div style="line-height:1.7;">' + senderHtml + '</div>' +
      '<div style="text-align:right;white-space:nowrap;padding-left:16px;">' + dateHtml + '</div>' +
    '</div>' +
    recipientBlock + subjectLine +
    '<div style="margin-bottom:20px;">' + salutation + '</div>' +
    '<div style="margin-bottom:40px;">' + bodyHtml + '</div>' +
    '<div>Z poważaniem,</div>' +
    '<div style="margin-top:36px;"><b>' + esc(fullName || 'Imię Nazwisko') + '</b></div>';

  return '<div style="background:#fff;padding:52px 56px;font-family:Georgia,\'Times New Roman\',serif;font-size:12.5px;line-height:1.8;color:#1a1a1a;box-sizing:border-box;">' + inner + '</div>';
}

function openLmPdf(paperHtml, fname) {
  var fullDoc = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>' +
    '<style>*{box-sizing:border-box}body{margin:0;padding:0;background:#fff;}</style>' +
    '</head><body>' + paperHtml +
    '<script>var _lmDone=false;window.onload=function(){if(_lmDone)return;_lmDone=true;' +
    'html2pdf().set({margin:[18,18,18,18],filename:"' + fname + '",image:{type:"jpeg",quality:0.98},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}})' +
    '.from(document.body.firstElementChild).save().then(function(){setTimeout(function(){window.close()},1000)});' +
    '};<\/script></body></html>';
  var win = window.open('', '_blank');
  if (win) { win.document.write(fullDoc); win.document.close(); }
  else { showToast('Zezwól na otwieranie okien dla tej strony.'); }
}

// ── DOWNLOAD ──
function downloadDoc(docId, format) {
  var doc = (window._allDocs || []).find(function(d) { return d.id === docId; });
  if (!doc || !doc.text) { showToast('Brak treści dokumentu.'); return; }
  var safeName = (doc.name || 'dokument').replace(/[\s\/\\:*?"<>|]+/g, '_');
  var text = doc.text;

  if (format === 'txt') {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    triggerDl(URL.createObjectURL(blob), safeName + '.txt');

  } else if (format === 'pdf') {
    if (doc.typeId === 'faktura' || text.indexOf('__FAK_JSON__:') === 0) {
      var fakJson = doc.fakDataJson || (text.indexOf('__FAK_JSON__:') === 0 ? text.slice('__FAK_JSON__:'.length) : null);
      if (!fakJson) { showToast('Brak danych faktury.'); return; }
      sessionStorage.setItem('dokumo_editFakData', fakJson);
      sessionStorage.setItem('dokumo_editFakDocId', doc.id);
      var ftype = 'vat';
      try { ftype = JSON.parse(fakJson).type || 'vat'; } catch(e) {}
      window.open('faktura.html?type=' + ftype + '&autodownload=1', '_blank');
      return;
    }
    if (doc.typeId === 'cover-letter' || text.indexOf('__LM_HTML__:') === 0) {
      var fname = safeName + '.pdf';
      var paperHtml = null;
      // Priorytet: covDataJson → pełna rekonstrukcja 1:1 z edytorem
      if (doc.covDataJson) {
        try { paperHtml = buildCoverLetterHTML(JSON.parse(doc.covDataJson)); } catch(e) {}
      }
      // Fallback: zapisany HTML
      if (!paperHtml && text.indexOf('__LM_HTML__:') === 0) {
        paperHtml = text.slice('__LM_HTML__:'.length);
      }
      if (paperHtml) { openLmPdf(paperHtml, fname); } else { showToast('Brak danych do wygenerowania PDF.'); }
      return;
    }
    if (text.indexOf('__CV_HTML__:') === 0) {
      // CV with template — use Railway Puppeteer service (same as kreator-cv.html)
      var cvHtml = text.slice('__CV_HTML__:'.length);
      downloadCvPdf(cvHtml, safeName);
    } else {
      var safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var win = window.open('', '_blank');
      win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + escHtml(doc.name) + '</title>');
      win.document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/scr'+'ipt>');
      win.document.write('<style>body{font-family:Arial,sans-serif;font-size:12pt;line-height:1.7;margin:2.5cm;color:#111}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:11pt}@media print{body{margin:2cm}}</style>');
      win.document.write('</head><body><pre>' + safe + '</pre>');
      win.document.write('<script>window.onload=function(){html2pdf().set({margin:25,filename:"'+safeName+'.pdf",image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(document.body.firstElementChild).save().then(function(){setTimeout(function(){window.close()},800)});}<\/script>');
      win.document.write('</body></html>');
      win.document.close();
    }

  } else if (format === 'docx') {
    var rtf = buildRTF(text, doc.name || 'Dokument');
    var blob = new Blob([rtf], { type: 'application/rtf' });
    triggerDl(URL.createObjectURL(blob), safeName + '.rtf');
  }
}

async function downloadCvPdf(html, safeName) {
  showToast('Generowanie PDF…');
  try {
    var token = typeof window._fbToken === 'function' ? await window._fbToken() : window._fbToken;
    if (!token) { showToast('Zaloguj się aby pobrać PDF.'); return; }
    var resp = await fetch('/api/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ html: html, filename: safeName })
    });
    if (!resp.ok) {
      var err = await resp.json().catch(function() { return {}; });
      showToast('Błąd PDF: ' + (err.error || resp.status)); return;
    }
    var blob = await resp.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = safeName + '.pdf'; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
  } catch(e) {
    showToast('Błąd generowania PDF: ' + e.message);
  }
}

function triggerDl(url, filename) {
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function buildRTF(text, title) {
  var esc = function(s) {
    return s.replace(/\\/g,'\\\\').replace(/[{}]/g, function(c) { return '\\' + c; })
      .replace(/[\u0080-\uFFFF]/g, function(c) {
        var code = c.charCodeAt(0);
        return code > 32767 ? '{\\uc1\\u'+(code-65536)+'?}' : '\\u'+code+'?';
      });
  };
  var lines = text.split('\n').map(function(l) {
    var e = esc(l); return e.trim() ? e + '\\par' : '\\par';
  }).join('\n');
  return '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0\\froman\\fcharset238 Times New Roman;}}' +
    '{\\colortbl ;\\red17\\green17\\blue17;}\\f0\\fs24\\cf1\\sl360\\slmult1 ' +
    '{\\b\\fs28 ' + esc(title) + '}\\par\\par ' + lines + '}';
}

// ── EDIT ──
var _editDocId = null;

function editDoc(docId) {
  var doc = (window._allDocs || []).find(function(d) { return d.id === docId; });
  if (!doc) return;
  // Cover letter → redirect to generator
  if (doc.typeId === 'cover-letter' || (doc.text && doc.text.indexOf('__LM_HTML__:') === 0)) {
    if (doc.covDataJson) {
      sessionStorage.setItem('dokumo_editLmData', doc.covDataJson);
      sessionStorage.removeItem('dokumo_editLmText');
    } else {
      sessionStorage.removeItem('dokumo_editLmData');
      var rawText = (doc.text || '').indexOf('__LM_HTML__:') === 0 ? '' : (doc.text || '');
      if (rawText) sessionStorage.setItem('dokumo_editLmText', rawText);
      else sessionStorage.removeItem('dokumo_editLmText');
    }
    sessionStorage.setItem('dokumo_editLmDocId', docId);
    window.location.href = 'list-motywacyjny.html';
    return;
  }
  // Faktura → redirect to faktura generator
  if (doc.typeId === 'faktura' || (doc.text && doc.text.indexOf('__FAK_JSON__:') === 0)) {
    var fakJson = doc.fakDataJson || (doc.text && doc.text.indexOf('__FAK_JSON__:') === 0 ? doc.text.slice('__FAK_JSON__:'.length) : null);
    if (fakJson) sessionStorage.setItem('dokumo_editFakData', fakJson);
    sessionStorage.setItem('dokumo_editFakDocId', docId);
    var ftype = 'vat';
    try { ftype = JSON.parse(fakJson || '{}').type || 'vat'; } catch(e) {}
    window.location.href = 'faktura.html?type=' + ftype;
    return;
  }
  // CV → redirect to kreator
  if (doc.typeId === 'cv' || (doc.text && doc.text.indexOf('__CV_HTML__:') === 0)) {
    if (doc.cvDataJson) {
      sessionStorage.setItem('dokumo_editCvData', doc.cvDataJson);
    } else {
      sessionStorage.removeItem('dokumo_editCvData');
    }
    // Pass template so kreator skips template picker
    var tplParam = 'nova';
    try { var saved = JSON.parse(doc.cvDataJson || '{}'); if (saved.__template) tplParam = saved.__template; } catch(e) {}
    window.location.href = 'kreator-cv.html?template=' + tplParam;
    return;
  }
  // Other docs → inline editor
  _editDocId = docId;
  document.getElementById('editTitle').textContent = 'Edytuj: ' + (doc.name || 'Dokument');
  document.getElementById('editTextarea').value = doc.text || '';
  document.getElementById('editOverlay').classList.add('open');
  document.getElementById('editTextarea').focus();
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
  _editDocId = null;
}

async function saveEdit() {
  if (!_editDocId) return;
  var text = document.getElementById('editTextarea').value;
  var token = await getToken();
  if (!token) { showToast('Błąd autoryzacji.'); return; }
  var btn = document.querySelector('.m-edit-save');
  btn.textContent = 'Zapisywanie…'; btn.disabled = true;
  try {
    var res = await fetch('/api/update-doc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ docId: _editDocId, text: text })
    });
    if (!res.ok) throw new Error();
    var doc = (window._allDocs || []).find(function(d) { return d.id === _editDocId; });
    if (doc) doc.text = text;
    closeEdit();
    showToast('Dokument zapisany.');
  } catch(e) {
    showToast('Błąd zapisu. Spróbuj ponownie.');
  } finally {
    btn.textContent = 'Zapisz'; btn.disabled = false;
  }
}

// ── DELETE ──
function askDelete(docId) {
  var doc = (window._allDocs || []).find(function(d) { return d.id === docId; });
  var name = doc ? doc.name : 'ten dokument';
  document.getElementById('confirmMsg').textContent = 'Usunąć "' + name + '"? Tej operacji nie można cofnąć.';
  document.getElementById('confirmDeleteBtn').onclick = function() { doDelete(docId); };
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }
async function doDelete(docId) {
  await deleteDocAPI(docId);
  closeConfirm();
  window._allDocs = (window._allDocs || []).filter(function(d) { return d.id !== docId; });
  filterAndRender();
  showToast('Dokument usunięty.');
}

// ── SELECT MODE ──
var _selectMode = false;
var _selected = {};

function toggleSelectMode() {
  _selectMode ? exitSelectMode() : enterSelectMode();
}

function enterSelectMode() {
  _selectMode = true;
  _selected = {};
  document.getElementById('myDocGrid').classList.add('select-mode');
  document.getElementById('bulkBar').classList.add('open');
  document.getElementById('btnSelectAll').textContent = 'Anuluj';
  updateBulkBar();
}

function exitSelectMode() {
  _selectMode = false;
  _selected = {};
  document.getElementById('myDocGrid').classList.remove('select-mode');
  document.getElementById('bulkBar').classList.remove('open');
  document.getElementById('btnSelectAll').textContent = 'Zaznacz';
  document.querySelectorAll('.d-card.selected').forEach(function(c) { c.classList.remove('selected'); });
  document.querySelectorAll('.d-card-cb').forEach(function(cb) { cb.checked = false; });
}

function toggleCard(docId, cardEl, cb) {
  if (!_selectMode) return;
  if (_selected[docId]) {
    delete _selected[docId];
    cardEl.classList.remove('selected');
    cb.checked = false;
  } else {
    _selected[docId] = true;
    cardEl.classList.add('selected');
    cb.checked = true;
  }
  updateBulkBar();
}

function selectAll() {
  var allVisible = document.querySelectorAll('.d-card[data-id]');
  var allSelected = allVisible.length > 0 && Object.keys(_selected).length === allVisible.length;
  if (allSelected) {
    // odznacz wszystkie
    _selected = {};
    allVisible.forEach(function(c) {
      c.classList.remove('selected');
      var cb = c.querySelector('.d-card-cb'); if (cb) cb.checked = false;
    });
  } else {
    // zaznacz wszystkie
    allVisible.forEach(function(c) {
      var id = c.getAttribute('data-id');
      _selected[id] = true;
      c.classList.add('selected');
      var cb = c.querySelector('.d-card-cb'); if (cb) cb.checked = true;
    });
  }
  updateBulkBar();
}

function updateBulkBar() {
  var count = Object.keys(_selected).length;
  var allVisible = document.querySelectorAll('.d-card[data-id]').length;
  document.getElementById('bulkCount').textContent = count + ' zaznaczon' + (count === 1 ? 'y' : 'ych');
  document.getElementById('bulkDelBtn').disabled = count === 0;
  document.getElementById('bulkSelectAllBtn').textContent =
    count === allVisible && allVisible > 0 ? 'Odznacz wszystkie' : 'Zaznacz wszystkie';
}

function askDeleteSelected() {
  var count = Object.keys(_selected).length;
  if (!count) return;
  document.getElementById('confirmMsg').textContent =
    'Usunąć ' + count + ' ' + (count === 1 ? 'dokument' : count < 5 ? 'dokumenty' : 'dokumentów') + '? Tej operacji nie można cofnąć.';
  document.getElementById('confirmDeleteBtn').onclick = doDeleteSelected;
  document.getElementById('confirmOverlay').classList.add('open');
}

async function doDeleteSelected() {
  var ids = Object.keys(_selected);
  closeConfirm();
  var token = await getToken();
  if (!token) { showToast('Błąd autoryzacji.'); return; }
  showToast('Usuwanie ' + ids.length + ' dokumentów…');
  await Promise.all(ids.map(function(id) {
    return fetch('/api/update-doc', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ docId: id })
    }).catch(function(){});
  }));
  window._allDocs = (window._allDocs || []).filter(function(d) { return !_selected[d.id]; });
  exitSelectMode();
  filterAndRender();
  showToast('Usunięto ' + ids.length + ' dokumentów.');
}

// ── TOAST ──
function showToast(msg) {
  var t = document.getElementById('myToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}
</script>
