<html lang="pl">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje dokumenty – Dokumo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --panel2:#f4f5f8; --sb:#0f1117;
  --t1:#111827; --t2:#5b6472; --t3:#9aa3b2;
  --line:#eceef2; --line2:#e2e5ea;
  --acc:#6d5efc; --acc2:#22d3ee;
  --grad:linear-gradient(135deg,#6d5efc 0%,#8b5cf6 55%,#22d3ee 130%);
  --k:#0ea5a4; --kbg:#e6faf8; --b:#6d5efc; --bbg:#eeecff; --n:#f59e0b;
  --red:#ef4444;
  --sh-sm:0 1px 2px rgba(17,24,39,.05);
  --sh:0 1px 3px rgba(17,24,39,.06),0 8px 24px rgba(17,24,39,.06);
  --sh-lg:0 2px 6px rgba(17,24,39,.07),0 18px 40px rgba(30,30,60,.12);
  --r:14px;
  /* legacy aliases (na wypadek pozostałych referencji inline) */
  --surface:#ffffff; --surface2:#f4f5f8; --surface3:#e9e8e4;
  --border:#eceef2; --border2:#e2e5ea; --ink:#111827; --ink2:#5b6472; --ink3:#9aa3b2;
  --green:#0ea5a4; --green-bright:#0ea5a4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ── SIDEBAR ── */
.sb{background:var(--sb);color:#e7e9ee;display:flex;flex-direction:column;padding:16px 14px;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:9px;padding:6px 8px 16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.01em;color:#fff;text-decoration:none}
.sb-brand .logo{width:28px;height:28px;border-radius:8px;background:var(--grad);display:grid;place-items:center;overflow:hidden}
.sb-new{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--grad);color:#fff;border:none;border-radius:11px;padding:11px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:none;box-shadow:0 6px 18px rgba(109,94,252,.4);transition:transform .15s}
.sb-new:hover{transform:translateY(-1px)}
.sb-new span{font-size:1.05rem;line-height:1}
.sb-sec{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5a6272;padding:20px 8px 8px}
.sb-nav{display:flex;flex-direction:column;gap:2px}
.m-filter{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#b9c0cd;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:none;background:none;text-align:left;width:100%;transition:.14s;letter-spacing:0;text-transform:none}
.m-filter:hover{background:rgba(255,255,255,.05);color:#fff}
.m-filter.active{background:rgba(109,94,252,.18);color:#fff}
.m-filter .ico{width:18px;text-align:center;font-size:13px;opacity:.9}
.m-filter .ct{margin-left:auto;font-size:11.5px;font-weight:700;color:#7b8393;background:rgba(255,255,255,.06);padding:1px 8px;border-radius:20px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.m-filter.active .ct{background:rgba(255,255,255,.16);color:#e7e9ee}
.sb-spacer{flex:1}
.sb-usage{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.sb-usage-top{display:flex;justify-content:space-between;font-size:12px;color:#b9c0cd}
.sb-usage-top b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.sb-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.sb-bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:4px;transition:width .4s}
.sb-bar i.hot{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.sb-plan{font-size:10.5px;color:#7b8393;margin-top:7px;line-height:1.5}
.sb-acct{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;text-decoration:none;transition:.14s}
.sb-acct:hover{background:rgba(255,255,255,.05)}
.sb-av{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex-shrink:0;text-transform:uppercase}
.sb-acct .nm{font-size:12.5px;font-weight:700;color:#e7e9ee;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-acct .em{font-size:11px;color:#6b7382;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MAIN ── */
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:15px 26px;border-bottom:1px solid var(--line);background:rgba(247,248,250,.82);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.top h1{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center}
.m-count-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bbg);color:var(--acc);margin-left:9px;font-family:'DM Sans',sans-serif}
.search{flex:1;max-width:440px;position:relative;margin-left:4px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 12px 9px 34px;font-family:inherit;font-size:13.5px;color:var(--t1);outline:none;box-shadow:var(--sh-sm);transition:.15s}
.search input::placeholder{color:var(--t3)}
.search input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,94,252,.14)}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:14px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:2px}
.seg button{border:none;background:none;padding:6px 9px;border-radius:7px;cursor:pointer;color:var(--t3);font-size:14px;line-height:1;transition:.14s}
.seg button.on{background:var(--panel);color:var(--acc);box-shadow:var(--sh-sm)}
.sort{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer;outline:none;box-shadow:var(--sh-sm)}

.body{padding:22px 26px 70px}
.body-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.crumb{font-size:13px;color:var(--t2);font-weight:500}
.btn-select-all{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer;box-shadow:var(--sh-sm);transition:.14s;white-space:nowrap}
.btn-select-all:hover{color:var(--t1);border-color:var(--t3)}

/* ── GRID + CARDS ── */
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px}
.m-grid.list{grid-template-columns:1fr;gap:8px}
.d-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s,border-color .2s}
.d-card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--line2)}
.d-card-top{padding:16px 16px 14px}
.d-card-row1{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.d-card-icon{width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;font-size:18px;line-height:1;border-radius:11px;color:#fff;background:linear-gradient(135deg,#334155,#64748b);box-shadow:0 5px 14px rgba(30,30,60,.2)}
.cat-kariera .d-card-icon{background:linear-gradient(135deg,#0d9488,#22d3ee);box-shadow:0 5px 14px rgba(13,148,136,.28)}
.cat-biznes .d-card-icon{background:linear-gradient(135deg,#6d5efc,#8b5cf6);box-shadow:0 5px 14px rgba(109,94,252,.28)}
.d-card-meta{flex:1;min-width:0}
.d-card-name{font-family:'Bricolage Grotesque',sans-serif;font-size:14.5px;font-weight:700;color:var(--t1);line-height:1.32;margin-bottom:9px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-cat-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--t2);letter-spacing:.01em}
.cat-kariera .d-cat-badge{background:var(--kbg);color:var(--k)}
.cat-biznes .d-cat-badge{background:var(--bbg);color:var(--b)}
.d-status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--t3);margin-left:6px;letter-spacing:0;text-transform:none;background:none;border:none;padding:0}
.d-status-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block}
.d-card-date{font-size:11.5px;color:var(--t3);margin-top:9px;font-variant-numeric:tabular-nums}
.d-card-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:linear-gradient(180deg,#fcfcfd,#f8f9fb)}
.d-action-btn{padding:6px 11px;font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--t2);cursor:pointer;transition:.14s;white-space:nowrap}
.d-action-btn:hover{color:var(--t1);border-color:var(--t3)}
.d-action-btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(109,94,252,.28)}
.d-action-btn.primary:hover{color:#fff;box-shadow:0 7px 16px rgba(109,94,252,.36)}
.d-action-btn.danger:hover{border-color:rgba(239,68,68,.4);color:var(--red);background:rgba(239,68,68,.06)}
/* reveal actions on hover (pointer devices only) */
@media(hover:hover){
  .d-card-actions{max-height:0;padding-top:0;padding-bottom:0;opacity:0;overflow:hidden;border-top-color:transparent;transition:max-height .24s,opacity .2s,padding .24s}
  .d-card:hover .d-card-actions{max-height:60px;opacity:1;padding-top:12px;padding-bottom:12px;border-top-color:var(--line)}
}

/* list view */
.m-grid.list .d-card{display:flex;align-items:center}
.m-grid.list .d-card-top{flex:1;min-width:0;padding:11px 16px;border:none}
.m-grid.list .d-card-row1{margin:0;align-items:center}
.m-grid.list .d-card-icon{width:36px;height:36px;font-size:15px}
.m-grid.list .d-card-name{margin-bottom:4px}
.m-grid.list .d-card-date{display:none}
.m-grid.list .d-card-actions{border-top:none;border-left:1px solid var(--line);background:none;max-height:none!important;opacity:1!important;padding:0 14px!important;flex-shrink:0}
@media(max-width:760px){.m-grid.list .d-action-btn:not(.primary){display:none}}

/* select mode */
.d-card-cb{display:none;position:absolute;top:12px;right:12px;z-index:3;width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);background:var(--panel);cursor:pointer;accent-color:var(--acc)}
.select-mode .d-card-cb{display:block}
.select-mode .d-card{cursor:pointer}
.d-card.selected{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,94,252,.16)}
.d-card.selected .d-card-cb{border-color:var(--acc)}

/* empty / loading */
.m-empty{text-align:center;padding:72px 24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm)}
.m-empty-icon{font-size:1.7rem;margin:0 auto 16px;display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--bbg)}
.m-empty-title{font-family:'Bricolage Grotesque',sans-serif;font-size:1.25rem;font-weight:800;color:var(--t1);letter-spacing:-.02em;margin-bottom:8px}
.m-empty-sub{font-size:.88rem;color:var(--t2);line-height:1.6;margin-bottom:22px;max-width:40ch;margin-left:auto;margin-right:auto}
.m-empty-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:999px;background:var(--grad);color:#fff;border:none;font-family:'Bricolage Grotesque',sans-serif;font-size:.84rem;font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(109,94,252,.28);transition:transform .16s}
.m-empty-btn:hover{transform:translateY(-2px)}

/* bulk bar */
.bulk-bar{display:none;position:fixed;bottom:22px;left:calc(50% + 125px);transform:translateX(-50%);background:var(--sb);color:#fff;border-radius:14px;padding:10px 10px 10px 18px;box-shadow:0 18px 44px rgba(15,17,23,.4);align-items:center;gap:10px;z-index:400;font-family:inherit;font-size:.84rem;white-space:nowrap}
.bulk-bar.open{display:flex;animation:fadeUp .25s ease both}
.bulk-bar-count{font-weight:700}
.bulk-bar-cancel{padding:8px 14px;border-radius:9px;border:1.5px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.8);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:.15s}
.bulk-bar-cancel:hover{border-color:rgba(255,255,255,.5);color:#fff}
.bulk-bar-del{padding:8px 16px;border-radius:9px;border:none;background:var(--red);color:#fff;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.bulk-bar-del:hover{opacity:.88}
.bulk-bar-del:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:820px){.bulk-bar{left:50%}}

/* modals */
.m-edit-overlay,.m-confirm-overlay{display:none;position:fixed;inset:0;background:rgba(15,17,23,.5);backdrop-filter:blur(8px);z-index:800;align-items:center;justify-content:center}
.m-edit-overlay.open,.m-confirm-overlay.open{display:flex}
.m-edit-box{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:24px;width:100%;max-width:700px;margin:16px;box-shadow:var(--sh-lg);animation:fadeUp .25s ease both;display:flex;flex-direction:column;gap:15px;max-height:86vh}
.m-edit-title{font-family:'Bricolage Grotesque',sans-serif;font-size:1.05rem;font-weight:800;color:var(--t1)}
.m-edit-textarea{flex:1;min-height:320px;max-height:55vh;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--t1);font-family:inherit;font-size:.88rem;line-height:1.7;padding:15px;resize:vertical;outline:none;transition:.15s}
.m-edit-textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,94,252,.14)}
.m-edit-btns{display:flex;gap:10px;justify-content:flex-end}
.m-edit-cancel,.m-confirm-cancel{padding:11px 22px;border:1px solid var(--line2);background:var(--panel2);border-radius:11px;font-family:inherit;font-size:.8rem;font-weight:700;color:var(--t2);cursor:pointer;transition:.15s}
.m-edit-cancel:hover,.m-confirm-cancel:hover{color:var(--t1);border-color:var(--t3)}
.m-edit-save{padding:11px 26px;border:none;background:var(--grad);border-radius:11px;font-family:inherit;font-size:.8rem;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(109,94,252,.28);transition:transform .16s}
.m-edit-save:hover{transform:translateY(-1px)}
.m-confirm-box{background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;margin:16px;box-shadow:var(--sh-lg);animation:fadeUp .25s ease both;text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.m-confirm-title{font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;font-weight:800;color:var(--t1);margin-bottom:9px}
.m-confirm-sub{font-size:.86rem;color:var(--t2);line-height:1.6;margin-bottom:22px}
.m-confirm-btns{display:flex;gap:10px}
.m-confirm-cancel{flex:1}
.m-confirm-delete{flex:1;padding:12px;border:none;background:var(--red);color:#fff;border-radius:11px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.m-confirm-delete:hover{opacity:.88}

/* toast */
.m-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--sb);color:#fff;padding:13px 24px;border-radius:14px;font-family:inherit;font-size:.84rem;font-weight:600;z-index:900;transition:transform .32s cubic-bezier(.2,.7,.2,1);pointer-events:none;white-space:nowrap;box-shadow:0 14px 40px rgba(15,17,23,.32)}
.m-toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px}
  .sb-brand{padding:0;margin-right:auto}
  .sb-new{padding:9px 14px}
  .sb-sec,.sb-usage,.sb-spacer{display:none}
  .sb-nav{flex-direction:row;flex:1 0 100%;overflow-x:auto;gap:4px;order:5}
  .m-filter{width:auto;flex-shrink:0}
  .m-filter .ct{margin-left:6px}
  .sb-acct{padding:6px}.sb-acct .nm,.sb-acct .em{display:none}
  .top{flex-wrap:wrap}.search{order:5;max-width:none;flex:1 0 100%;margin:0}
  .body{padding:18px 16px 70px}
  .m-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- APP SHELL -->
<div class="app">
  <aside class="sb">
    <a class="sb-brand" href="index.html"><span class="logo"><img src="logo2-64.png" alt="" style="width:20px;height:20px;border-radius:5px;display:block"></span> Dokumo</a>
    <a class="sb-new" href="index.html"><span>+</span> Nowy dokument</a>
    <div class="sb-sec">Biblioteka</div>
    <div class="sb-nav" id="myFilters">
      <button class="m-filter active" onclick="setFilter('all',this)"><span class="ico">▦</span> Wszystkie <span class="ct" id="cntAll">0</span></button>
      <button class="m-filter" onclick="setFilter('kariera',this)"><span class="ico">◔</span> Kariera <span class="ct" id="cntKariera">0</span></button>
      <button class="m-filter" onclick="setFilter('biznes',this)"><span class="ico">◈</span> Biznes <span class="ct" id="cntBiznes">0</span></button>
      <button class="m-filter" onclick="setFilter('review',this)"><span class="ico">⚑</span> Do przeglądu <span class="ct" id="cntReview">0</span></button>
    </div>
    <div class="sb-spacer"></div>
    <div class="sb-usage">
      <div class="sb-usage-top"><span id="sbUsageLabel">W bibliotece</span><b id="sbUsageVal"><span id="sbLibCount">0</span></b></div>
      <div class="sb-bar" id="sbBar" style="display:none"><i id="sbBarFill"></i></div>
      <div class="sb-plan" id="sbPlan">&nbsp;</div>
    </div>
    <a class="sb-acct" href="konto.html">
      <div class="sb-av" id="sbAvatar">?</div>
      <div style="min-width:0"><div class="nm" id="sbName">Moje konto</div><div class="em" id="sbEmail">—</div></div>
    </a>
  </aside>

  <div class="main">
    <div class="top">
      <h1>Moje dokumenty<span class="m-count-badge" id="docCount"></span></h1>
      <div class="search"><span class="mag">⌕</span><input id="mySearch" type="text" placeholder="Szukaj dokumentu…" oninput="filterAndRender()"></div>
      <div class="top-right">
        <div class="seg" id="viewSeg">
          <button class="on" onclick="setView('grid',this)" title="Siatka" aria-label="Widok siatki">▦</button>
          <button onclick="setView('list',this)" title="Lista" aria-label="Widok listy">☰</button>
        </div>
        <select class="sort" id="mySort" onchange="filterAndRender()">
          <option value="newest">Najnowsze</option>
          <option value="oldest">Najstarsze</option>
          <option value="name">Nazwa A–Z</option>
        </select>
      </div>
    </div>
    <div class="body">
      <div class="body-head">
        <span class="crumb" id="resultsLabel"></span>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const __c=await(await fetch('/api/nip-lookup?fbconfig')).json();const app = initializeApp(__c);
const auth = getAuth(app);

onAuthStateChanged(auth, async user => {
  window._fbReady = true;
  window._fbToken = user ? () => user.getIdToken(true) : null;
  window._firebaseUser = user || null;
  if (user) {
    localStorage.setItem('dokumo_user', JSON.stringify({
      name: user.displayName || '',
      email: user.email || '',
      photo: user.photoURL || ''
    }));
    try {
      const token = await user.getIdToken();
      const res = await fetch('/api/check-sub', { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (data.active && data.expiresAt) {
        localStorage.setItem('dokumo_sub', JSON.stringify({
          plan: data.plan, expiresAt: data.expiresAt, cancelled: !!data.cancelled,
          downloadsLeft: (typeof data.downloadsLeft === 'number' ? data.downloadsLeft : null),
          genUsed: (typeof data.genUsed === 'number' ? data.genUsed : null),
          genLimit: (typeof data.genLimit === 'number' ? data.genLimit : null),
        }));
        if (typeof paintAccount === 'function') paintAccount();
      }
    } catch(e) {}
  } else {
    localStorage.removeItem('dokumo_user');
  }
  if (!user) {
    document.getElementById('resultsLabel').textContent = '';
    document.getElementById('myDocGrid').innerHTML =
      '<div class="m-empty">' +
      '<span class="m-empty-icon">🔒</span>' +
      '<div class="m-empty-title">Zaloguj się</div>' +
      '<p class="m-empty-sub">Musisz być zalogowany, aby zobaczyć swoje dokumenty.</p>' +
      '<a href="konto.html" class="m-empty-btn">Zaloguj się →</a>' +
      '</div>';
  } else {
    loadAndRender();
  }
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// ── STATE ──
window._allDocs = [];
var activeFilter = 'all';
var _view = 'grid';

function escHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ── API ──
async function getToken() {
  for (var i = 0; i < 30 && !window._fbReady; i++) {
    await new Promise(function(r) { setTimeout(r, 100); });
  }
  if (window._fbToken) {
    try { return await window._fbToken(); } catch(e) {}
  }
  return null;
}

async function loadDocsFromAPI() {
  var token = await getToken();
  if (!token) return [];
  try {
    var res = await fetch('/api/get-docs', { headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) return [];
    var data = await res.json();
    return data.docs || [];
  } catch(e) { return []; }
}

async function deleteDocAPI(docId) {
  var token = await getToken();
  if (!token) return;
  await fetch('/api/update-doc', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ docId: docId })
  });
}

// ── RENDER ──
async function loadAndRender() {
  paintAccount();
  document.getElementById('myDocGrid').innerHTML =
    '<div style="padding:40px;text-align:center;color:var(--ink3);font-size:.85rem;">Ładowanie dokumentów…</div>';
  window._allDocs = await loadDocsFromAPI();
  filterAndRender();
}

function setView(v, btn) {
  _view = v;
  document.querySelectorAll('#viewSeg button').forEach(function(b) { b.classList.remove('on'); });
  if (btn) btn.classList.add('on');
  filterAndRender();
}

function paintAccount() {
  try {
    var u = {}; try { u = JSON.parse(localStorage.getItem('dokumo_user') || '{}') || {}; } catch(e) {}
    var sub = null; try { sub = JSON.parse(localStorage.getItem('dokumo_sub') || 'null'); } catch(e) {}
    var set = function(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
    var nm = u.name || 'Moje konto';
    set('sbName', nm); set('sbEmail', u.email || '—');
    var av = document.getElementById('sbAvatar');
    if (av) {
      var p = (nm || '').trim().split(/\s+/);
      av.textContent = (((p[0]||'')[0]||'') + ((p[1]||'')[0]||'')) || ((u.email||'?')[0] || '?').toUpperCase();
    }
    var PLAN = { start:'Pakiet Start', kariera:'Pakiet Kariera', biznes:'Pakiet Biznes', promax:'Pro Max' };
    var active = sub && sub.expiresAt && new Date(sub.expiresAt) > new Date();
    var planName = (active && sub.plan) ? (PLAN[sub.plan] || sub.plan) : null;

    // ── Widget wykorzystania: limit miesięczny / pobrania Startu / rozmiar biblioteki ──
    var bar = document.getElementById('sbBar');
    var fill = document.getElementById('sbBarFill');
    var valEl = document.getElementById('sbUsageVal');
    function showBar(used, max) {
      if (!bar || !fill) return;
      bar.style.display = '';
      var pct = Math.max(0, Math.min(100, Math.round(used / max * 100)));
      fill.style.width = pct + '%';
      fill.className = pct >= 85 ? 'hot' : '';
    }
    var expStr = active ? new Date(sub.expiresAt).toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';

    if (active && typeof sub.genLimit === 'number' && sub.genLimit > 0 && typeof sub.genUsed === 'number') {
      // Plany miesięczne: licznik generowań w bieżącym miesiącu
      var monthName = new Date().toLocaleDateString('pl-PL', { month: 'long' });
      set('sbUsageLabel', 'Dokumenty (' + monthName + ')');
      if (valEl) valEl.textContent = sub.genUsed + ' / ' + sub.genLimit;
      showBar(sub.genUsed, sub.genLimit);
      var d = new Date(); var next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      var nextStr = next.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short' });
      set('sbPlan', planName + ' · limit odnowi się ' + nextStr + (sub.cancelled ? ' · ważny do ' + expStr : ''));
    } else if (active && sub.plan === 'start') {
      // Start: pula 5 pobrań
      var left = typeof sub.downloadsLeft === 'number' ? sub.downloadsLeft : 5;
      set('sbUsageLabel', 'Pobrania (Start)');
      if (valEl) valEl.textContent = left + ' / 5';
      showBar(5 - left, 5);
      set('sbPlan', 'Pakiet Start · ważny do ' + expStr);
    } else {
      // Brak pakietu (lub brak danych o limicie): pokaż rozmiar biblioteki
      set('sbUsageLabel', 'W bibliotece');
      if (valEl && !document.getElementById('sbLibCount')) valEl.innerHTML = '<span id="sbLibCount">' + ((window._allDocs || []).length) + '</span>';
      if (bar) bar.style.display = 'none';
      set('sbPlan', planName ? (planName + (expStr ? ' · do ' + expStr : '')) : 'Bez aktywnego pakietu');
    }
  } catch(e) {}
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.m-filter').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  filterAndRender();
}

function updateStats() {
  var all = window._allDocs || [];
  var k = 0, b = 0, r = 0, latest = 0;
  all.forEach(function(d) {
    if (d.cat === 'kariera') k++; else if (d.cat === 'biznes') b++;
    if (d.complianceNeedsReview) r++;
    var ts = new Date(d.createdAt || 0).getTime();
    if (ts > latest) latest = ts;
  });
  var set = function(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; };
  set('cntAll', all.length); set('cntKariera', k); set('cntBiznes', b); set('cntReview', r);
  set('sbLibCount', all.length);
}

function filterAndRender() {
  var docs = [].concat(window._allDocs || []);
  var q = (document.getElementById('mySearch').value || '').toLowerCase().trim();
  var sort = document.getElementById('mySort').value;

  // Ukryj listy motywacyjne bez danych (nie można wygenerować PDF)
  docs = docs.filter(function(d) {
    if (d.typeId === 'cover-letter' || (d.text && d.text.indexOf('__LM_HTML__:') === 0)) {
      return d.covDataJson || (d.text && d.text.indexOf('__LM_HTML__:') === 0);
    }
    return true;
  });

  if (activeFilter === 'kariera') docs = docs.filter(function(d) { return d.cat === 'kariera'; });
  else if (activeFilter === 'biznes') docs = docs.filter(function(d) { return d.cat === 'biznes'; });
  else if (activeFilter === 'review') docs = docs.filter(function(d) { return d.complianceNeedsReview; });

  if (q) docs = docs.filter(function(d) { return (d.name||'').toLowerCase().includes(q); });

  if (sort === 'newest') docs.sort(function(a,b) { return new Date(b.createdAt||0) - new Date(a.createdAt||0); });
  if (sort === 'oldest') docs.sort(function(a,b) { return new Date(a.createdAt||0) - new Date(b.createdAt||0); });
  if (sort === 'name') docs.sort(function(a,b) { return (a.name||'').localeCompare(b.name||'','pl'); });

  var total = (window._allDocs || []).length;
  var badge = document.getElementById('docCount');
  badge.textContent = total ? total : '';
  badge.style.display = total ? '' : 'none';
  updateStats();
  document.getElementById('resultsLabel').textContent =
    docs.length + ' ' + (docs.length === 1 ? 'dokument' : docs.length < 5 ? 'dokumenty' : 'dokumentów');

  var grid = document.getElementById('myDocGrid');

  if (docs.length === 0) {
    grid.innerHTML = '<div class="m-empty">' +
      '<span class="m-empty-icon">📂</span>' +
      '<div class="m-empty-title">' + (total === 0 ? 'Brak dokumentów' : 'Brak wyników') + '</div>' +
      '<p class="m-empty-sub">' + (total === 0 ? 'Wygeneruj swój pierwszy dokument — zajmie to mniej niż minutę.' : 'Spróbuj innego filtra lub frazy.') + '</p>' +
      (total === 0 ? '<a href="index.html" class="m-empty-btn">Przeglądaj dokumenty →</a>' : '') +
      '</div>';
    return;
  }

  var html = '<div class="m-grid' + (_selectMode ? ' select-mode' : '') + (_view === 'list' ? ' list' : '') + '">';
  docs.forEach(function(doc) {
    var id = doc.id || '';
    var name = escHtml(doc.name || 'Dokument');
    var icon = escHtml(doc.icon || '📄');
    var catLabel = escHtml(doc.catLabel || doc.cat || '');
    var date = formatDate(doc.createdAt);
    var isSel = _selected[id] ? ' selected' : '';
    html += '<div class="d-card cat-' + (doc.cat || 'inne') + isSel + '" data-id="' + id + '" onclick="if(_selectMode){var cb=this.querySelector(\'.d-card-cb\');toggleCard(\'' + id + '\',this,cb);}">';
    html += '<input type="checkbox" class="d-card-cb"' + (isSel ? ' checked' : '') + ' onclick="event.stopPropagation();var card=this.closest(\'.d-card\');toggleCard(\'' + id + '\',card,this);">';
    html += '<div class="d-card-top">';
    html += '<div class="d-card-row1">';
    html += '<div class="d-card-icon">' + icon + '</div>';
    html += '<div class="d-card-meta">';
    html += '<div class="d-card-name" title="' + name + '">' + name + '</div>';
    html += '<div>';
    if (catLabel) html += '<span class="d-cat-badge">' + catLabel + '</span>';
    html += '<span class="d-status-badge">&#10003; Wygenerowany</span>';
    if (doc.complianceNeedsReview) {
      var radarTitle = escHtml((doc.complianceFlags || []).map(function(f){ return f.summary || f.title || ''; }).join(' ') || 'Zmiana w przepisach może dotyczyć tego dokumentu.');
      html += '<span class="d-status-badge" style="background:rgba(243,156,18,.15);color:#b9770e" title="' + radarTitle + '">&#9888; Może wymagać przeglądu</span>';
    }
    html += '</div>';
    html += '</div></div>';
    html += '<div class="d-card-date">Utworzono: ' + date + '</div>';
    html += '</div>';
    html += '<div class="d-card-actions">';
    if (doc.status === 'generated' || doc.text) {
      html += '<button class="d-action-btn primary" onclick="downloadDoc(\'' + id + '\',\'pdf\')">PDF</button>';
      html += '<button class="d-action-btn" onclick="downloadDoc(\'' + id + '\',\'txt\')">TXT</button>';
      html += '<button class="d-action-btn" onclick="downloadDoc(\'' + id + '\',\'docx\')">Word</button>';
    }
    html += '<button class="d-action-btn" title="Edytuj" onclick="editDoc(\'' + id + '\')" style="margin-left:auto">✏️</button>';
    html += '<button class="d-action-btn danger" onclick="askDelete(\'' + id + '\')">&#10005; Usuń</button>';
    html += '</div></div>';
  });
  html += '</div>';
  grid.innerHTML = html;
}

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ── COVER LETTER HTML BUILDER ──
function buildCoverLetterHTML(d) {
  var esc = function(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var nl2br = function(s) { return esc(s).replace(/\n/g,'<br>'); };
  var fullName = [d.firstName, d.lastName].filter(Boolean).join(' ');
  var today = new Date().toLocaleDateString('pl-PL', {day:'numeric', month:'long', year:'numeric'});

  var senderHtml = '<b>' + esc(fullName || 'Imię Nazwisko') + '</b>';
  if (d.street) senderHtml += '<br>' + esc(d.street);
  var zipCity = [d.zip, d.city].filter(Boolean).join(' ');
  if (zipCity) senderHtml += '<br>' + esc(zipCity);
  if (d.email) senderHtml += '<br>' + esc(d.email);
  if (d.phone) senderHtml += '<br>' + esc(d.phone);

  var dateHtml = esc((d.city || 'Miejscowość') + ', ' + today);

  var recipientBlock = '';
  if (d.rCompany || d.rContact) {
    var rLines = [];
    if (d.rCompany) rLines.push('<b>' + esc(d.rCompany) + '</b>');
    if (d.rContact) rLines.push(esc(d.rContact));
    if (d.rStreet)  rLines.push(esc(d.rStreet));
    var rZipCity = [d.rZip, d.rCity].filter(Boolean).join(' ');
    if (rZipCity) rLines.push(esc(rZipCity));
    recipientBlock = '<div style="margin-bottom:32px;">' + rLines.join('<br>') + '</div>';
  }

  var subjectLine = d.position
    ? '<div style="margin-bottom:24px;">Dotyczy: Aplikacja na stanowisko <b>' + esc(d.position) + '</b>' + (d.company ? ' w firmie <b>' + esc(d.company) + '</b>' : '') + '</div>'
    : '';

  var salutation = d.rContact
    ? 'Szanowna Pani/Panie ' + esc((d.rContact.split(' ').slice(-1)[0]) || '') + ','
    : 'Szanowni Państwo,';

  var bodyHtml = d.body
    ? '<div style="text-align:justify;">' + nl2br(d.body) + '</div>'
    : '';

  var inner =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;">' +
      '<div style="line-height:1.7;">' + senderHtml + '</div>' +
      '<div style="text-align:right;white-space:nowrap;padding-left:16px;">' + dateHtml + '</div>' +
    '</div>' +
    recipientBlock + subjectLine +
    '<div style="margin-bottom:20px;">' + salutation + '</div>' +
    '<div style="margin-bottom:40px;">' + bodyHtml + '</div>' +
    '<div>Z poważaniem,</div>' +
    '<div style="margin-top:36px;"><b>' + esc(fullName || 'Imię Nazwisko') + '</b></div>';

  return '<div style="background:#fff;padding:52px 56px;font-family:Georgia,\'Times New Roman\',serif;font-size:12.5px;line-height:1.8;color:#1a1a1a;box-sizing:border-box;">' + inner + '</div>';
}

function openLmPdf(paperHtml, fname) {
  var fullDoc = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>' +
    '<style>*{box-sizing:border-box}body{margin:0;padding:0;background:#fff;}</style>' +
    '</head><body>' + paperHtml +
    '<script>var _lmDone=false;window.onload=function(){if(_lmDone)return;_lmDone=true;' +
    'html2pdf().set({margin:[18,18,18,18],filename:"' + fname + '",image:{type:"jpeg",quality:0.98},html2canvas:{scale:2,useCORS:true,logging:false},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}})' +
    '.from(document.body.firstElementChild).save().then(function(){setTimeout(function(){window.close()},1000)});' +
    '};<\/script></body></html>';
  var win = window.open('', '_blank');
  if (win) { win.document.write(fullDoc); win.document.close(); }
  else { showToast('Zezwól na otwieranie okien dla tej strony.'); }
}

// ── DOWNLOAD ──
function downloadDoc(docId, format) {
  var doc = (window._allDocs || []).find(function(d) { return d.id === docId; });
  if (!doc || !doc.text) { showToast('Brak treści dokumentu.'); return; }
  var safeName = (doc.name || 'dokument').replace(/[\s\/\\:*?"<>|]+/g, '_');
  var text = doc.text;

  if (format === 'txt') {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    triggerDl(URL.createObjectURL(blob), safeName + '.txt');

  } else if (format === 'pdf') {
    if (doc.typeId === 'faktura' || text.indexOf('__FAK_JSON__:') === 0) {
      var fakJson = doc.fakDataJson || (text.indexOf('__FAK_JSON__:') === 0 ? text.slice('__FAK_JSON__:'.length) : null);
      if (!fakJson) { showToast('Brak danych faktury.'); return; }
      sessionStorage.setItem('dokumo_editFakData', fakJson);
      sessionStorage.setItem('dokumo_editFakDocId', doc.id);
      var ftype = 'vat';
      try { ftype = JSON.parse(fakJson).type || 'vat'; } catch(e) {}
      window.open('faktura.html?type=' + ftype + '&autodownload=1', '_blank');
      return;
    }
    if (doc.typeId === 'cover-letter' || text.indexOf('__LM_HTML__:') === 0) {
      var fname = safeName + '.pdf';
      var paperHtml = null;
      // Priorytet: covDataJson → pełna rekonstrukcja 1:1 z edytorem
      if (doc.covDataJson) {
        try { paperHtml = buildCoverLetterHTML(JSON.parse(doc.covDataJson)); } catch(e) {}
      }
      // Fallback: zapisany HTML
      if (!paperHtml && text.indexOf('__LM_HTML__:') === 0) {
        paperHtml = text.slice('__LM_HTML__:'.length);
      }
      if (paperHtml) { openLmPdf(paperHtml, fname); } else { showToast('Brak danych do wygenerowania PDF.'); }
      return;
    }
    if (text.indexOf('__CV_HTML__:') === 0) {
      // CV with template — use Railway Puppeteer service (same as kreator-cv.html)
      var cvHtml = text.slice('__CV_HTML__:'.length);
      downloadCvPdf(cvHtml, safeName);
    } else {
      var safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var win = window.open('', '_blank');
      win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + escHtml(doc.name) + '</title>');
      win.document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/scr'+'ipt>');
      win.document.write('<style>body{font-family:Arial,sans-serif;font-size:12pt;line-height:1.7;margin:2.5cm;color:#111}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:11pt}@media print{body{margin:2cm}}</style>');
      win.document.write('</head><body><pre>' + safe + '</pre>');
      win.document.write('<script>window.onload=function(){html2pdf().set({margin:25,filename:"'+safeName+'.pdf",image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(document.body.firstElementChild).save().then(function(){setTimeout(function(){window.close()},800)});}<\/script>');
      win.document.write('</body></html>');
      win.document.close();
    }

  } else if (format === 'docx') {
    var rtf = buildRTF(text, doc.name || 'Dokument');
    var blob = new Blob([rtf], { type: 'application/rtf' });
    triggerDl(URL.createObjectURL(blob), safeName + '.rtf');
  }
}

async function downloadCvPdf(html, safeName) {
  showToast('Generowanie PDF…');
  try {
    var token = typeof window._fbToken === 'function' ? await window._fbToken() : window._fbToken;
    if (!token) { showToast('Zaloguj się aby pobrać PDF.'); return; }
    var resp = await fetch('/api/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ html: html, filename: safeName })
    });
    if (!resp.ok) {
      var err = await resp.json().catch(function() { return {}; });
      showToast('Błąd PDF: ' + (err.error || resp.status)); return;
    }
    var blob = await resp.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = safeName + '.pdf'; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
  } catch(e) {
    showToast('Błąd generowania PDF: ' + e.message);
  }
}

function triggerDl(url, filename) {
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

function buildRTF(text, title) {
  var esc = function(s) {
    return s.replace(/\\/g,'\\\\').replace(/[{}]/g, function(c) { return '\\' + c; })
      .replace(/[\u0080-\uFFFF]/g, function(c) {
        var code = c.charCodeAt(0);
        return code > 32767 ? '{\\uc1\\u'+(code-65536)+'?}' : '\\u'+code+'?';
      });
  };
  var lines = text.split('\n').map(function(l) {
    var e = esc(l); return e.trim() ? e + '\\par' : '\\par';
  }).join('\n');
  return '{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0\\froman\\fcharset238 Times New Roman;}}' +
    '{\\colortbl ;\\red17\\green17\\blue17;}\\f0\\fs24\\cf1\\sl360\\slmult1 ' +
    '{\\b\\fs28 ' + esc(title) + '}\\par\\par ' + lines + '}';
}

// ── EDIT ──
var _editDocId = null;

function editDoc(docId) {
  var doc = (window._allDocs || []).find(function(d) { return d.id === docId; });
  if (!doc) return;
  // Cover letter → redirect to generator
  if (doc.typeId === 'cover-letter' || (doc.text && doc.text.indexOf('__LM_HTML__:') === 0)) {
    if (doc.covDataJson) {
      sessionStorage.setItem('dokumo_editLmData', doc.covDataJson);
      sessionStorage.removeItem('dokumo_editLmText');
    } else {
      sessionStorage.removeItem('dokumo_editLmData');
      var rawText = (doc.text || '').indexOf('__LM_HTML__:') === 0 ? '' : (doc.text || '');
      if (rawText) sessionStorage.setItem('dokumo_editLmText', rawText);
      else sessionStorage.removeItem('dokumo_editLmText');
    }
    sessionStorage.setItem('dokumo_editLmDocId', docId);
    window.location.href = 'list-motywacyjny.html';
    return;
  }
  // Faktura → redirect to faktura generator
  if (doc.typeId === 'faktura' || (doc.text && doc.text.indexOf('__FAK_JSON__:') === 0)) {
    var fakJson = doc.fakDataJson || (doc.text && doc.text.indexOf('__FAK_JSON__:') === 0 ? doc.text.slice('__FAK_JSON__:'.length) : null);
    if (fakJson) sessionStorage.setItem('dokumo_editFakData', fakJson);
    sessionStorage.setItem('dokumo_editFakDocId', docId);
    var ftype = 'vat';
    try { ftype = JSON.parse(fakJson || '{}').type || 'vat'; } catch(e) {}
    window.location.href = 'faktura.html?type=' + ftype;
    return;
  }
  // CV → redirect to kreator
  if (doc.typeId === 'cv' || (doc.text && doc.text.indexOf('__CV_HTML__:') === 0)) {
    if (doc.cvDataJson) {
      sessionStorage.setItem('dokumo_editCvData', doc.cvDataJson);
    } else {
      sessionStorage.removeItem('dokumo_editCvData');
    }
    // Pass template so kreator skips template picker
    var tplParam = 'nova';
    try { var saved = JSON.parse(doc.cvDataJson || '{}'); if (saved.__template) tplParam = saved.__template; } catch(e) {}
    window.location.href = 'kreator-cv.html?template=' + tplParam;
    return;
  }
  // Other docs → inline editor
  _editDocId = docId;
  document.getElementById('editTitle').textContent = 'Edytuj: ' + (doc.name || 'Dokument');
  document.getElementById('editTextarea').value = doc.text || '';
  document.getElementById('editOverlay').classList.add('open');
  document.getElementById('editTextarea').focus();
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('open');
  _editDocId = null;
}

async function saveEdit() {
  if (!_editDocId) return;
  var text = document.getElementById('editTextarea').value;
  var token = await getToken();
  if (!token) { showToast('Błąd autoryzacji.'); return; }
  var btn = document.querySelector('.m-edit-save');
  btn.textContent = 'Zapisywanie…'; btn.disabled = true;
  try {
    var res = await fetch('/api/update-doc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ docId: _editDocId, text: text })
    });
    if (!res.ok) throw new Error();
    var doc = (window._allDocs || []).find(function(d) { return d.id === _editDocId; });
    if (doc) doc.text = text;
    closeEdit();
    showToast('Dokument zapisany.');
  } catch(e) {
    showToast('Błąd zapisu. Spróbuj ponownie.');
  } finally {
    btn.textContent = 'Zapisz'; btn.disabled = false;
  }
}

// ── DELETE ──
function askDelete(docId) {
  var doc = (window._allDocs || []).find(function(d) { return d.id === docId; });
  var name = doc ? doc.name : 'ten dokument';
  document.getElementById('confirmMsg').textContent = 'Usunąć "' + name + '"? Tej operacji nie można cofnąć.';
  document.getElementById('confirmDeleteBtn').onclick = function() { doDelete(docId); };
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('open'); }
async function doDelete(docId) {
  await deleteDocAPI(docId);
  closeConfirm();
  window._allDocs = (window._allDocs || []).filter(function(d) { return d.id !== docId; });
  filterAndRender();
  showToast('Dokument usunięty.');
}

// ── SELECT MODE ──
var _selectMode = false;
var _selected = {};

function toggleSelectMode() {
  _selectMode ? exitSelectMode() : enterSelectMode();
}

function enterSelectMode() {
  _selectMode = true;
  _selected = {};
  document.getElementById('myDocGrid').classList.add('select-mode');
  document.getElementById('bulkBar').classList.add('open');
  document.getElementById('btnSelectAll').textContent = 'Anuluj';
  updateBulkBar();
}

function exitSelectMode() {
  _selectMode = false;
  _selected = {};
  document.getElementById('myDocGrid').classList.remove('select-mode');
  document.getElementById('bulkBar').classList.remove('open');
  document.getElementById('btnSelectAll').textContent = 'Zaznacz';
  document.querySelectorAll('.d-card.selected').forEach(function(c) { c.classList.remove('selected'); });
  document.querySelectorAll('.d-card-cb').forEach(function(cb) { cb.checked = false; });
}

function toggleCard(docId, cardEl, cb) {
  if (!_selectMode) return;
  if (_selected[docId]) {
    delete _selected[docId];
    cardEl.classList.remove('selected');
    cb.checked = false;
  } else {
    _selected[docId] = true;
    cardEl.classList.add('selected');
    cb.checked = true;
  }
  updateBulkBar();
}

function selectAll() {
  var allVisible = document.querySelectorAll('.d-card[data-id]');
  var allSelected = allVisible.length > 0 && Object.keys(_selected).length === allVisible.length;
  if (allSelected) {
    // odznacz wszystkie
    _selected = {};
    allVisible.forEach(function(c) {
      c.classList.remove('selected');
      var cb = c.querySelector('.d-card-cb'); if (cb) cb.checked = false;
    });
  } else {
    // zaznacz wszystkie
    allVisible.forEach(function(c) {
      var id = c.getAttribute('data-id');
      _selected[id] = true;
      c.classList.add('selected');
      var cb = c.querySelector('.d-card-cb'); if (cb) cb.checked = true;
    });
  }
  updateBulkBar();
}

function updateBulkBar() {
  var count = Object.keys(_selected).length;
  var allVisible = document.querySelectorAll('.d-card[data-id]').length;
  document.getElementById('bulkCount').textContent = count + ' zaznaczon' + (count === 1 ? 'y' : 'ych');
  document.getElementById('bulkDelBtn').disabled = count === 0;
  document.getElementById('bulkSelectAllBtn').textContent =
    count === allVisible && allVisible > 0 ? 'Odznacz wszystkie' : 'Zaznacz wszystkie';
}

function askDeleteSelected() {
  var count = Object.keys(_selected).length;
  if (!count) return;
  document.getElementById('confirmMsg').textContent =
    'Usunąć ' + count + ' ' + (count === 1 ? 'dokument' : count < 5 ? 'dokumenty' : 'dokumentów') + '? Tej operacji nie można cofnąć.';
  document.getElementById('confirmDeleteBtn').onclick = doDeleteSelected;
  document.getElementById('confirmOverlay').classList.add('open');
}

async function doDeleteSelected() {
  var ids = Object.keys(_selected);
  closeConfirm();
  var token = await getToken();
  if (!token) { showToast('Błąd autoryzacji.'); return; }
  showToast('Usuwanie ' + ids.length + ' dokumentów…');
  await Promise.all(ids.map(function(id) {
    return fetch('/api/update-doc', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ docId: id })
    }).catch(function(){});
  }));
  window._allDocs = (window._allDocs || []).filter(function(d) { return !_selected[d.id]; });
  exitSelectMode();
  filterAndRender();
  showToast('Usunięto ' + ids.length + ' dokumentów.');
}

// ── TOAST ──
function showToast(msg) {
  var t = document.getElementById('myToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2800);
}
</script>
